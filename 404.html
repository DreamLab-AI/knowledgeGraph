<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Narrative Goldmine</title>
  <script>
    // GitHub Pages serves this root 404.html for every unknown path.
    // The research notes under /notes/ are a separate static site (Quartz), so
    // a miss there goes to its own 404 page. Everything else is a deep link into
    // this SPA: store the path and let index.html replay it.
    if (location.pathname.indexOf('/notes/') === 0) {
      location.replace(location.origin + '/notes/404.html');
    } else {
      sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
      location.replace(location.origin + '/');
    }
  </script>
</head>
<body></body>
</html>
